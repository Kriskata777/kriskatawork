backend:
  name: git-gateway
  branch: main

media_folder: "Photography/Uploads"
public_folder: "/Photography/Uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # 1. НАЧАЛНА СТРАНИЦА (HOME)
  - name: "pages"
    label: "1. Начална Страница"
    files:
      - name: "home"
        label: "Настройки на Home Page"
        file: "data/home.json"
        fields:
          - {label: "Заглавие (Hero)", name: "hero_title", widget: "string", default: "Най-разглеждани"}
          - label: "Мнения от клиенти"
            name: "reviews"
            widget: "list"
            fields:
              - {label: "Име на клиента", name: "name", widget: "string"}
              - {label: "Мнение (Текст)", name: "quote", widget: "text"}
              - {label: "Снимка на клиента", name: "photo", widget: "image"}
              - {label: "Линк (YouTube/Insta)", name: "social_link", widget: "string", required: false}

  # 2. СТРАНИЦА КАТЕГОРИИ (WORK)
  - name: "work_page"
    label: "2. Страница Категории (Work)"
    files:
      - name: "work"
        label: "Настройки на Категориите"
        file: "data/work.json"
        fields:
          - label: "Списък Категории"
            name: "categories"
            widget: "list"
            fields:
              - {label: "Заглавие", name: "title", widget: "string"}
              - {label: "Снимка (Thumbnail)", name: "image", widget: "image"}
              - {label: "Линк към страница", name: "url", widget: "string", default: "photography.html"}

  # 3. ФОТОГРАФИЯ (АЛБУМИ) - ПОПРАВЕНО!
- name: "albums"
    label: "3. Фото Албуми"
    # ТУК БЕШЕ ГРЕШКАТА - махнахме реда "folder: ..."
    files:
      - name: "albums"
        label: "Списък албуми"
        file: "data.json"
        label_singular: "Албум"
        fields:
          - label: "Албуми"
            name: "albums"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "ID (URL Name)", name: "id", widget: "string", hint: "напр. djamala"}
              - {label: "Заглавие", name: "title", widget: "string"}
              - {label: "Корица", name: "cover", widget: "image"}
              - label: "Галерия снимки"
                name: "photos"
                widget: "list"
                fields:
                  - {label: "Снимка", name: "image", widget: "image"}

  # 4. ВИДЕА (ВСИЧКИ ВИДОВЕ)
  - name: "videos"
    label: "4. Видеа (YouTube)"
    files:
      - name: "shooted"
        label: "Заснети Видеа"
        file: "data/shooted_videos.json"
        fields:
          - label: "Списък Видеа"
            name: "videos"
            widget: "list"
            fields:
              - {label: "Заглавие", name: "title", widget: "string"}
              - {label: "YouTube ID", name: "youtube_id", widget: "string", hint: "Само кода (напр. dQw4w9WgXcQ)"}
      
      - name: "edited"
        label: "Обработени Видеа"
        file: "data/edited_videos.json"
        fields:
          - label: "Списък Видеа"
            name: "videos"
            widget: "list"
            fields:
              - {label: "Заглавие", name: "title", widget: "string"}
              - {label: "YouTube ID", name: "youtube_id", widget: "string"}

      - name: "subtitles"
        label: "Субтитри"
        file: "data/subtitles.json"
        fields:
          - label: "Списък Видеа"
            name: "videos"
            widget: "list"
            fields:
              - {label: "Заглавие", name: "title", widget: "string"}
              - {label: "YouTube ID", name: "youtube_id", widget: "string"}

  # 5. ГАЛЕРИИ (THUMBNAILS & COVERS)
  - name: "galleries"
    label: "5. Галерии (Thumbnails/Covers)"
    files:
      - name: "thumbnails"
        label: "Thumbnails"
        file: "data/thumbnails.json"
        fields:
          - label: "Снимки"
            name: "images"
            widget: "list"
            fields: [{label: "Image", name: "image", widget: "image"}]
            
      - name: "covers"
        label: "Covers"
        file: "data/covers.json"
        fields:
          - label: "Снимки"
            name: "images"
            widget: "list"
            fields: [{label: "Image", name: "image", widget: "image"}]



