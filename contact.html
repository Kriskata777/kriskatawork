<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти</title>
    
    <link rel="icon" href="logo.png" type="image/png">
    
    <!-- Добавяне на шрифт Sofia Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- Основни настройки (синхронизирани с останалите страници) --- */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #00d2ff;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --transition: 0.3s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Sofia Sans', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 15%, rgba(0, 210, 255, 0.04) 0%, transparent 60%);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        /* --- Хедър и Навигация --- */
        header.main-header {
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 2005; 
            border-bottom: 1px solid #333;
            padding: 5px 5%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            grid-column: 2 / 3;
        }

        .logo-container img {
            height: 95px; 
            width: auto;
            border-radius: 8px;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            grid-column: 3 / 4;
        }

        .desktop-menu {
            display: flex;
            gap: 30px;
        }

        .desktop-menu a {
            font-size: 1.1rem;
            font-weight: 500;
            transition: color var(--transition);
        }

        .desktop-menu a:hover {
            color: var(--primary-color);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            z-index: 2010; 
        }

        .hamburger .line {
            width: 30px;
            height: 3px;
            background-color: var(--text-main);
            transition: all 0.3s ease-in-out;
            transform-origin: center left;
        }

        .hamburger.open .line:nth-child(1) { transform: rotate(45deg) translate(2px, -2px); }
        .hamburger.open .line:nth-child(2) { opacity: 0; }
        .hamburger.open .line:nth-child(3) { transform: rotate(-45deg) translate(2px, 2px); }

        .dropdown-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #0066ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .dropdown-content.show {
            opacity: 1;
            visibility: visible;
        }

        .dropdown-content ul { text-align: center; padding: 0; }
        .dropdown-content li { margin-bottom: 40px; }
        .dropdown-content a { font-size: 2.5rem; font-weight: bold; color: #ffffff; }

        /* --- Контейнер за Контакти --- */
        .contact-container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
            min-height: calc(100vh - 180px);
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            font-weight: 800;
            letter-spacing: 1px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background-color: var(--primary-color);
            margin: 15px auto 0;
            border-radius: 2px;
        }

        /* --- СТИЛОВЕ ЗА КАЛЕНДАРА --- */
        .calendar-wrapper {
            background-color: var(--surface-color);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            margin-bottom: 60px;
            position: relative;
        }
        
        /* Лек акцент за календара */
        .calendar-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 12px;
            pointer-events: none;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
        }

        .calendar-wrapper iframe {
            width: 100%;
            height: 600px;
            border: none;
            display: block;
            border-radius: 8px; /* Леко заобляне и на самия iframe */
        }

        /* --- СТИЛОВЕ ЗА ФОРМАТА --- */
        .booking-form-wrapper {
            background-color: var(--surface-color);
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            position: relative;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-top: 30px;
        }

        .form-group {
            margin-bottom: 0; /* Променено заради grid gap */
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: all var(--transition);
        }

        /* Премахване на дефолтната стрелка при select в някои браузъри */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a0a0a0%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 12px auto;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #181818;
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.1);
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 16px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.4);
        }

        /* Съобщение при изпращане */
        .form-message {
            display: none; /* Скрито по подразбиране */
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }
        
        .form-message.success {
            display: block;
            background-color: rgba(46, 213, 115, 0.1);
            color: #2ed573;
            border: 1px solid #2ed573;
        }
        
        .form-message.error {
            display: block;
            background-color: rgba(255, 71, 87, 0.1);
            color: #ff4757;
            border: 1px solid #ff4757;
        }

        /* --- Футър --- */
        footer {
            text-align: center;
            padding: 30px;
            background-color: #0a0a0a;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #222;
        }

        /* --- Респонсив --- */
        @media (max-width: 768px) {
            header.main-header { grid-template-columns: 1fr auto 1fr; }
            .desktop-menu { display: none; }
            .hamburger { display: flex; justify-self: end; }
            
            .section-title { font-size: 2rem; }
            
            .form-grid { grid-template-columns: 1fr; }
            .booking-form-wrapper { padding: 30px 20px; }
            .calendar-wrapper iframe { height: 450px; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div></div> 
        
        <div class="logo-container">
            <a href="home.html">
                <img src="logo.png" alt="Kriskata Logo" class="logo">
            </a>
        </div>

        <nav>
            <ul class="desktop-menu">
                <li><a href="work.html">Категории</a></li>
                <li><a href="contact.html">Контакти</a></li>
            </ul>

            <div class="hamburger" id="hamburger-icon" onclick="toggleMenu()">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
        </nav>
    </header>

    <!-- Мобилно меню -->
    <div class="dropdown-content" id="mobileMenu">
        <ul>
            <li><a href="work.html" onclick="toggleMenu()">Категории</a></li>
            <li><a href="contact.html" onclick="toggleMenu()">Контакти</a></li>
        </ul>
    </div>

    <main class="contact-container">
        
        <h1 class="section-title">Календар</h1>
        
        <div class="calendar-wrapper">
            <iframe src="https://calendar.google.com/calendar/embed?src=2355c4f43d405953860e644215fdfac30b873d44e48613cd4e23e61dbe047e7e%40group.calendar.google.com&ctz=Europe%2FSofia" width="800" height="600" frameborder="0" scrolling="no"></iframe>
        </div>

        <div class="booking-form-wrapper">
            <h1 class="section-title">Направете запитване</h1>
            
            <!-- Формата вече няма action към Formspree, ще се обработва с JS -->
            <form id="contactForm">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Вашето име</label>
                        <input type="text" id="name" name="name" placeholder="Иван Петров" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Вашият Email</label>
                        <input type="email" id="email" name="email" placeholder="ivan@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="date">Желана дата</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label for="time">Желан час</label>
                        <select id="time" name="time">
                            <option value="morning">Сутрин (09:00 - 12:00)</option>
                            <option value="afternoon">Следобед (13:00 - 17:00)</option>
                            <option value="evening">Вечер (18:00+)</option>
                            <option value="full-day">Цял ден</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="type">Тип заснемане</label>
                        <select id="type" name="type">
                            <option value="portrait">Портретно / Лично</option>
                            <option value="event">Събитие / Парти</option>
                            <option value="commercial">Рекламно / Продуктово</option>
                            <option value="other">Друго</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="message">Съобщение / Детайли</label>
                        <textarea id="message" name="message" rows="5" placeholder="Разкажете ми малко повече за идеята си..."></textarea>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Изпрати запитване</button>
                
                <!-- Контейнер за съобщения за успех/грешка -->
                <div id="formMessage" class="form-message"></div>
            </form>

        </div>
    </main>

    <footer>
        © 2026 Kriskata. Всички права запазени.
    </footer>

    <script>
        // Функция за мобилното меню
        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            const hamburger = document.getElementById('hamburger-icon');
            
            menu.classList.toggle('show');
            hamburger.classList.toggle('open');
        }

        // --- ЛОГИКА ЗА GOOGLE APPS SCRIPT ---
        
        // ⚠️ ВАЖНО: ТУК СЛОЖИ СВОЯ URL АДРЕС ОТ GOOGLE APPS SCRIPT
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzulXuWPY8uY1suuN0ySYVxwpoTjRIldVO1eaVH2P0iQoDE-RA4u3XdC2UJnWKtmB4b/exec'; 

        const contactForm = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const formMessage = document.getElementById('formMessage');

        contactForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Спира стандартното презареждане

            // Промяна на бутона
            const originalBtnText = submitBtn.textContent;
            submitBtn.textContent = 'Изпращане...';
            submitBtn.disabled = true;
            formMessage.className = 'form-message'; // Скриваме старо съобщение

            // Взимане на данните от формата
            const formData = new FormData(contactForm);

            // Изпращане чрез Fetch API (AJAX)
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    // Успех
                    formMessage.className = 'form-message success';
                    formMessage.textContent = 'Благодаря! Вашето запитване беше изпратено успешно.';
                    contactForm.reset(); // Изчиства формата
                } else {
                    // Грешка от сървъра
                    throw new Error('Грешка при изпращането.');
                }
            })
            .catch(error => {
                // Грешка (напр. няма интернет)
                formMessage.className = 'form-message error';
                formMessage.textContent = 'Възникна грешка. Моля, опитайте отново по-късно.';
                console.error('Error!', error.message);
            })
            .finally(() => {
                // Връщаме бутона в нормално състояние
                submitBtn.textContent = originalBtnText;
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
