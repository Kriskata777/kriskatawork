<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакт и Резервации | Kriskata</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        /* Специфични стилове за страницата за контакти */
        body.contact-page {
            background-color: #1a1a1a;
            color: #f0f0f0;
        }

        .contact-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .section-subtitle {
            text-align: center;
            color: #bbb;
            margin-bottom: 40px;
        }

        /* СТИЛОВЕ ЗА КАЛЕНДАРА */
        .calendar-wrapper {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 50px;
        }

        .calendar-wrapper iframe {
            width: 100%;
            height: 600px;
            border: none;
            display: block;
        }

        /* СТИЛОВЕ ЗА ФОРМАТА */
        .booking-form-wrapper {
            background-color: #2a2a2a;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: #333;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ff4444;
            background-color: #3a3a3a;
        }

        .submit-btn {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background-color: #cc3333;
        }

        /* Мобилна версия */
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .calendar-wrapper iframe { height: 400px; }
        }
        /* МОБИЛНА ВЕРСИЯ - ПОПРАВКА НА ФОРМАТА */
        @media (max-width: 600px) {
            .booking-form-wrapper {
                padding: 15px !important; /* По-малко отстояние отстрани */
                text-align: left !important; /* Подравнява текстовете вляво */
            }

            .form-group {
                text-align: left !important; /* Гарантира, че етикетите са вляво */
                margin-left: 0 !important;
                margin-right: 0 !important;
            }

            input, select, textarea {
                width: 100% !important; /* Пълна ширина */
                max-width: 100% !important;
                box-sizing: border-box !important; /* Да не излизат извън екрана */
                margin: 0 !important; /* Премахва странни отстояния */
            }

            .submit-btn {
                width: 100% !important; /* Бутонът става цял ред (по-удобно) */
                margin-top: 10px;
            }
            
            /* Центриране само на заглавието на секцията */
            .section-title, .section-subtitle {
                text-align: center !important;
            }
        }
    </style>
</head>
<body class="contact-page">
    
 <header>
        <div class="logo-container">
            <a href="home.html">
                <img src="logo.png" alt="My Logo" class="logo"> <!-- Add your logo image here -->
            </a>
        </div>
        <nav>
            <nav>
                <div class="hamburger" onclick="toggleMenu()">
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                </div>
                <ul class="dropdown-content">
                    <li><a href="work.html" class="menu-link">Категории</a></li>
                    <li><a href="contact.html" class="menu-link">Контакти</a></li>
                </ul>
                <ul class="menu">
                    <li><a href="work.html" class="menu-link">Категории</a></li>
                    <li><a href="contact.html" class="menu-link">Контакти</a></li>
                </ul>
            </nav>
            
            <script src="menu.js"></script>
        </nav>
    </header>

    <div class="contact-container">
        
        <h2 class="section-title">Календар</h2>
        <p class="section-subtitle">Проверете свободните дати</p>
        
        <div class="calendar-wrapper">
            <iframe src="https://calendar.google.com/calendar/embed?src=2355c4f43d405953860e644215fdfac30b873d44e48613cd4e23e61dbe047e7e%40group.calendar.google.com&ctz=Europe%2FSofia" style="border: 0" width="800" height="600" frameborder="0" scrolling="no"></iframe>
        </div>

        <div class="booking-form-wrapper">
            <h2 class="section-title">Направете запитване</h2>
            <p class="section-subtitle">Харесахте си свободна дата? Изпратете ми заявка</p>
            

            <form action="https://formspree.io/f/mwpedjpy" method="POST">

        <div class="form-grid">
        <div class="form-group">
            <label>Вашето име</label>
            <input type="text" name="name" placeholder="Иван Петров" required>
        </div>

        <div class="form-group">
            <label>Вашият Email</label>
            <input type="email" name="email" placeholder="ivan@example.com" required>
        </div>

        <div class="form-group">
            <label>Желана дата</label>
            <input type="date" name="date" required>
        </div>

        <div class="form-group">
            <label>Желан час</label>
            <select name="time">
                <option value="morning">Сутрин (09:00 - 12:00)</option>
                <option value="afternoon">Следобед (13:00 - 17:00)</option>
                <option value="evening">Вечер (18:00+)</option>
                <option value="full-day">Цял ден</option>
            </select>
        </div>

        <div class="form-group full-width">
            <label>Тип заснемане</label>
            <select name="type">
                <option value="portrait">Портретно / Лично</option>
                <option value="event">Събитие / Парти</option>
                <option value="commercial">Рекламно / Продуктово</option>
                <option value="other">Друго</option>
            </select>
        </div>

        <div class="form-group full-width">
            <label>Съобщение / Детайли</label>
            <textarea name="message" rows="5"
                placeholder="Разкажете ми малко повече за идеята си..."></textarea>
        </div>
    </div>

    <button type="submit" class="submit-btn">Изпрати запитване</button>
</form>

        </div>

    </div>

    <footer>© Kriskata</footer>
</body>
</html>
