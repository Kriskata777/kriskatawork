<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Фотографско портфолио на Kriskata. Разгледай последните ми албуми и заснети събития.">
    <title>Фотография</title>
    
    <link rel="icon" href="logo.png" type="image/png">
    
    <!-- Добавяне на шрифт Sofia Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- Основни настройки и променливи --- */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #00d2ff;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --transition: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); /* По-плавна и "мазна" анимация */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Sofia Sans', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            /* Лек радиален градиент за премиум дълбочина */
            background-image: radial-gradient(circle at 50% 15%, rgba(0, 210, 255, 0.04) 0%, transparent 60%);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        /* --- Хедър и Навигация (Еднакви с останалите страници) --- */
        header.main-header {
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 2005;
            border-bottom: 1px solid #333;
            padding: 5px 5%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            grid-column: 2 / 3;
        }

        .logo-container img {
            height: 95px; 
            width: auto;
            border-radius: 8px;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            grid-column: 3 / 4;
        }

        .desktop-menu {
            display: flex;
            gap: 30px;
        }

        .desktop-menu a {
            font-size: 1.1rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .desktop-menu a:hover {
            color: var(--primary-color);
        }

        /* --- Мобилно меню (Хамбургер) --- */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            z-index: 2010;
        }

        .hamburger .line {
            width: 30px;
            height: 3px;
            background-color: var(--text-main);
            transition: all 0.3s ease-in-out;
            transform-origin: center left;
        }

        .hamburger.open .line:nth-child(1) { transform: rotate(45deg) translate(2px, -2px); }
        .hamburger.open .line:nth-child(2) { opacity: 0; }
        .hamburger.open .line:nth-child(3) { transform: rotate(-45deg) translate(2px, 2px); }

        .dropdown-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #0066ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .dropdown-content.show {
            opacity: 1;
            visibility: visible;
        }

        .dropdown-content ul { text-align: center; padding: 0; }
        .dropdown-content li { margin-bottom: 40px; }
        .dropdown-content a { font-size: 2.5rem; font-weight: bold; color: #ffffff; }

        /* --- Секция Фотография --- */
        .projects-section {
            padding: 60px 20px;
            min-height: calc(100vh - 180px);
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 50px;
            font-weight: 800;
            letter-spacing: 1px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background-color: var(--primary-color);
            margin: 15px auto 0;
            border-radius: 2px;
        }

        /* --- Мрежа за Албумите --- */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 колони на десктоп */
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .album-card {
            text-decoration: none;
            display: block;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--surface-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform var(--transition), box-shadow var(--transition);
        }

        /* Hover ефект за самата карта */
        .album-card:hover {
            transform: translateY(-8px); /* Повдигане нагоре */
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.25); /* Сияние */
        }

        .album-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9; /* Еднакъв размер за всички */
            overflow: hidden;
        }

        .album-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform var(--transition);
        }

        /* Hover ефект: приближаване на снимката */
        .album-card:hover img {
            transform: scale(1.08);
        }

        /* Тъмен филтър и текст */
        .album-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6); /* 60% затъмняване */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color var(--transition);
        }

        /* Hover ефект: изсветляване на филтъра */
        .album-card:hover .album-overlay {
            background-color: rgba(0, 0, 0, 0.2); 
        }

        .album-overlay h2 {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            padding: 20px;
            text-transform: uppercase; /* Главни букви за по-стилен вид */
            letter-spacing: 2px; /* Разстояние между буквите */
            text-shadow: 0 4px 15px rgba(0,0,0,0.9); /* По-дълбока сянка на текста */
            margin: 0;
            transition: transform var(--transition);
        }

        /* Hover ефект: текста леко "изкача" */
        .album-card:hover .album-overlay h2 {
            transform: scale(1.05);
        }

        /* --- Футър --- */
        footer {
            text-align: center;
            padding: 30px;
            background-color: #0a0a0a;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #222;
        }

        /* --- Респонсив Дизайн --- */
        @media (max-width: 1024px) {
            .album-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 на ред за таблети */
            }
        }

        @media (max-width: 768px) {
            header.main-header {
                grid-template-columns: 1fr auto 1fr;
            }
            .desktop-menu { display: none; }
            .hamburger { display: flex; justify-self: end; }
            
            .section-title { font-size: 2rem; }
            
            .album-grid {
                grid-template-columns: 1fr; /* 1 на ред за телефони */
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <div></div> 
        
        <div class="logo-container">
            <a href="home.html">
                <img src="logo.png" alt="Kriskata Logo" class="logo">
            </a>
        </div>

        <nav>
            <ul class="desktop-menu">
                <li><a href="work.html">Категории</a></li>
                <li><a href="contact.html">Контакти</a></li>
            </ul>

            <div class="hamburger" id="hamburger-icon" onclick="toggleMenu()">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
        </nav>
    </header>

    <!-- Мобилно меню -->
    <div class="dropdown-content" id="mobileMenu">
        <ul>
            <li><a href="work.html" onclick="toggleMenu()">Категории</a></li>
            <li><a href="contact.html" onclick="toggleMenu()">Контакти</a></li>
        </ul>
    </div>

    <!-- Основно съдържание -->
    <main>
        <section class="projects-section">
            <h1 class="section-title">Фотография</h1>
            
            <!-- Тук JavaScript ще зареди албумите -->
            <div class="album-grid" id="album-grid">
                <!-- Скелетите на албумите ще се генерират автоматично -->
            </div>
        </section>
    </main>

    <footer>
        © 2026 Kriskata. Всички права запазени.
    </footer>

    <!-- Скриптове -->
    <script>
        // Функция за мобилното меню
        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            const hamburger = document.getElementById('hamburger-icon');
            
            menu.classList.toggle('show');
            hamburger.classList.toggle('open');
        }

        // Извличане и рендиране на албумите от data.json
        document.addEventListener('DOMContentLoaded', () => {
            fetch('data.json')
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('album-grid');
                    const albums = data.albums || (data.data && data.data.albums) || [];
                    
                    grid.innerHTML = ''; // Изчистваме контейнера

                    // Генериране на HTML за всеки албум
                    albums.forEach(album => {
                        const link = document.createElement('a');
                        link.href = `album.html?id=${album.id}`;
                        link.className = 'album-card';
                        
                        // Логика за пътя на снимката
                        let cleanCover = album.cover ? album.cover.replace('public/', '') : 'logo.png';

                        link.innerHTML = `
                            <div class="album-image-wrapper">
                                <img src="${cleanCover}" alt="${album.title}" loading="lazy">
                                <div class="album-overlay">
                                    <h2>${album.title}</h2>
                                </div>
                            </div>
                        `;
                        grid.appendChild(link);
                    });
                })
                .catch(err => {
                    console.error("Грешка при зареждане на data.json:", err);
                    document.getElementById('album-grid').innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">Възникна грешка при зареждане на албумите.</p>';
                });
        });
    </script>
</body>
</html>
