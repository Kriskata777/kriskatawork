<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kriskata | Ковъри</title>
    
    <link rel="icon" href="logo.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #00d2ff;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --transition: 0.3s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Sofia Sans', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 15%, rgba(0, 210, 255, 0.04) 0%, transparent 60%);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        header.main-header {
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 2005; 
            border-bottom: 1px solid #333;
            padding: 5px 5%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            grid-column: 2 / 3;
        }

        .logo-container img {
            height: 95px; 
            width: auto;
            border-radius: 8px;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            grid-column: 3 / 4;
        }

        .desktop-menu {
            display: flex;
            gap: 30px;
        }

        .desktop-menu a {
            font-size: 1.1rem;
            font-weight: 500;
            transition: color var(--transition);
        }

        .desktop-menu a:hover {
            color: var(--primary-color);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            z-index: 2010; 
        }

        .hamburger .line {
            width: 30px;
            height: 3px;
            background-color: var(--text-main);
            transition: all 0.3s ease-in-out;
            transform-origin: center left;
        }

        .hamburger.open .line:nth-child(1) { transform: rotate(45deg) translate(2px, -2px); }
        .hamburger.open .line:nth-child(2) { opacity: 0; }
        .hamburger.open .line:nth-child(3) { transform: rotate(-45deg) translate(2px, 2px); }

        .dropdown-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #0066ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .dropdown-content.show {
            opacity: 1;
            visibility: visible;
        }

        .dropdown-content ul { text-align: center; padding: 0; }
        .dropdown-content li { margin-bottom: 40px; }
        .dropdown-content a { font-size: 2.5rem; font-weight: bold; color: #ffffff; }

        .projects-section {
            padding: 60px 20px;
            min-height: calc(100vh - 180px);
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 50px;
            font-weight: 800;
            letter-spacing: 1px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background-color: var(--primary-color);
            margin: 15px auto 0;
            border-radius: 2px;
        }

        .covers-gallery {
            padding: 0 20px;
            max-width: 1400px;
            margin: 0 auto;
            column-count: 3;
            column-gap: 25px;
        }

        .thumbnail-container {
            cursor: pointer;
            margin-bottom: 25px;
            break-inside: avoid;
            -webkit-column-break-inside: avoid;
            page-break-inside: avoid;
            
            border-radius: 12px;
            overflow: hidden;
            background: #2a2a2a; 
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .thumbnail-image11 {
            width: 100%;
            height: auto; /* Запазваме оригиналните пропорции */
            display: block;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .thumbnail-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 210, 255, 0.2);
        }

        .thumbnail-container:hover .thumbnail-image11 {
            transform: scale(1.03); 
        }
        
        .thumbnail-container::after {
            content: '';
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            box-shadow: inset 0 0 0 2px transparent;
            transition: box-shadow 0.3s ease;
            pointer-events: none;
            border-radius: 12px;
        }

        .thumbnail-container:hover::after {
            box-shadow: inset 0 0 0 2px var(--primary-color);
        }

        .lightbox {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            user-select: none;
            backdrop-filter: blur(5px);
        }

        .lightbox.active { display: flex; }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            object-fit: contain;
        }

        .lightbox-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 50px;
            font-weight: 300;
            padding: 20px 30px;
            cursor: pointer;
            transition: color 0.3s ease, background 0.3s ease;
            border-radius: 8px;
            user-select: none;
        }

        .lightbox-btn:hover { 
            color: #fff;
            background: rgba(255,255,255,0.1); 
        }
        .prev { left: 2vw; }
        .next { right: 2vw; }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: rgba(255,255,255,0.6);
            font-size: 40px;
            font-weight: 300;
            cursor: pointer;
            transition: color 0.3s ease;
            z-index: 3001;
        }
        .lightbox-close:hover { color: #fff; }

        footer {
            text-align: center;
            padding: 30px;
            background-color: #0a0a0a;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #222;
        }

        @media (max-width: 1024px) {
            .covers-gallery { column-count: 2; }
        }

        @media (max-width: 768px) {
            header.main-header { grid-template-columns: 1fr auto 1fr; }
            .desktop-menu { display: none; }
            .hamburger { display: flex; justify-self: end; }
            
            .section-title { font-size: 2rem; }
            .covers-gallery { column-count: 1; }
            
            .lightbox-btn { padding: 10px 15px; font-size: 30px; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div></div> 
        
        <div class="logo-container">
            <a href="home.html">
                <img src="logo.png" alt="Kriskata Logo" class="logo">
            </a>
        </div>

        <nav>
            <ul class="desktop-menu">
                <li><a href="work.html">Категории</a></li>
                <li><a href="contact.html">Контакти</a></li>
            </ul>

            <div class="hamburger" id="hamburger-icon" onclick="toggleMenu()">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
        </nav>
    </header>

    <div class="dropdown-content" id="mobileMenu">
        <ul>
            <li><a href="work.html" onclick="toggleMenu()">Категории</a></li>
            <li><a href="contact.html" onclick="toggleMenu()">Контакти</a></li>
        </ul>
    </div>

    <main>
        <section class="projects-section">
            <h1 class="section-title">Ковъри</h1>
            
            <div class="covers-gallery" id="covers-container">
                
                <div class="thumbnail-container">
                    <img src="/Covers/Жоро и Гената - cover.png" alt="Cover 1" class="thumbnail-image11" loading="lazy">
                </div>
                
                <div class="thumbnail-container">
                    <img src="/Covers/Banner - FINAL.jpg" alt="Cover 2" class="thumbnail-image11" loading="lazy">
                </div>
                
                <div class="thumbnail-container">
                    <img src="/Covers/Cover - Mitko Marianoff x Lucho - Отвъдното на любовта.png" alt="Cover 3" class="thumbnail-image11" loading="lazy">
                </div>
                
            </div>
        </section>
    </main>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        
        <div class="lightbox-btn prev" onclick="changeImage(-1)">&#10094;</div>
        <div class="lightbox-btn next" onclick="changeImage(1)">&#10095;</div>

        <div class="lightbox-content">
            <img class="lightbox-image" id="lightbox-img" src="" alt="Уголемен Ковър">
        </div>
    </div>

    <footer>
        © 2026 Kriskata. Всички права запазени.
    </footer>

    <script>
        // Функция за мобилното меню
        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            const hamburger = document.getElementById('hamburger-icon');
            
            menu.classList.toggle('show');
            hamburger.classList.toggle('open');
        }

        // АВТОМАТИЧНО ОТКРИВАНЕ НА СНИМКИТЕ ЗА LIGHTBOX
        let currentImages = [];
        let currentIndex = 0;
        
        document.addEventListener('DOMContentLoaded', () => {
            const imgElements = document.querySelectorAll('.thumbnail-image11');
            
            imgElements.forEach((img, index) => {
                currentImages.push(img.src);
                
                img.parentElement.addEventListener('click', () => {
                    openLightbox(index);
                });
            });
        });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(index) {
            currentIndex = index;
            updateLightboxImage();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // Спира скрола
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function changeImage(direction) {
            currentIndex += direction;
            if (currentIndex >= currentImages.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = currentImages.length - 1;
            updateLightboxImage();
        }

        function updateLightboxImage() {
            lightboxImg.src = currentImages[currentIndex];
        }

        // Затваряне при клик извън снимката
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        // Управление с клавиатура
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'ArrowRight') changeImage(1);
        });
    </script>
</body>
</html>
