<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заснети видеа</title>
    <link rel="icon" href="logo.png" type="image/png">
    
    <!-- Добавяне на шрифт Sofia Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- Вградени стилове (Синхронизирани с останалите страници) -->
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #00d2ff;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --transition: 0.3s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Sofia Sans', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            /* Лек радиален градиент за премиум усещане */
            background-image: radial-gradient(circle at 50% 30%, rgba(0, 210, 255, 0.03) 0%, transparent 60%);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        header.main-header {
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 2005; /* Висок z-index, за да стои над менюто */
            border-bottom: 1px solid #333;
            padding: 5px 5%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            grid-column: 2 / 3;
        }

        .logo-container img {
            height: 95px; /* Уголемено лого */
            width: auto;
            border-radius: 8px;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            grid-column: 3 / 4;
        }

        .desktop-menu {
            display: flex;
            gap: 30px;
        }

        .desktop-menu a {
            font-size: 1.1rem;
            font-weight: 500;
            transition: color var(--transition);
        }

        .desktop-menu a:hover {
            color: var(--primary-color);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            z-index: 2010; /* Над синия екран */
        }

        .hamburger .line {
            width: 30px;
            height: 3px;
            background-color: var(--text-main);
            transition: all 0.3s ease-in-out;
            transform-origin: center left;
        }

        .hamburger.open .line:nth-child(1) { transform: rotate(45deg) translate(2px, -2px); }
        .hamburger.open .line:nth-child(2) { opacity: 0; }
        .hamburger.open .line:nth-child(3) { transform: rotate(-45deg) translate(2px, 2px); }

        .dropdown-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #0066ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .dropdown-content.show {
            opacity: 1;
            visibility: visible;
        }

        .dropdown-content ul { text-align: center; padding: 0; }
        .dropdown-content li { margin-bottom: 40px; }
        .dropdown-content a { font-size: 2.5rem; font-weight: bold; color: #ffffff; }

        .projects-section {
            padding: 60px 20px;
            min-height: calc(100vh - 180px);
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 50px;
            font-weight: 800;
            letter-spacing: 1px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background-color: var(--primary-color);
            margin: 15px auto 0;
            border-radius: 2px;
        }

        /* Мрежа за видеата */
        .project-list-videos {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            /* 3 колони на ред */
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9; /* Винаги запазва пропорциите на видео */
            background-color: var(--surface-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .video-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 210, 255, 0.2);
        }

        .video-placeholder {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity var(--transition);
        }

        .video-container:hover .video-placeholder {
            opacity: 0.8;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }

        .play-button::after {
            content: '';
            display: block;
            margin-left: 5px; 
            border-style: solid;
            border-width: 10px 0 10px 18px;
            border-color: transparent transparent transparent #ffffff;
        }

        .video-container:hover .play-button {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            transform: translate(-50%, -50%) scale(1.1);
        }

        footer {
            text-align: center;
            padding: 30px;
            background-color: #0a0a0a;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #222;
        }

        @media (max-width: 768px) {
            header.main-header {
                grid-template-columns: 1fr auto 1fr;
            }
            .desktop-menu { display: none; }
            .hamburger { display: flex; justify-self: end; }
            .section-title { font-size: 2rem; }
            .project-list-videos {
                grid-template-columns: 1fr; /* Остава 1 колона на телефон */
                gap: 20px;
            }
        }
        
        @media (max-width: 1024px) and (min-width: 769px) {
            .project-list-videos {
                grid-template-columns: repeat(2, 1fr); /* 2 на ред за таблети */
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div></div> <!-- Симетрия -->
        
        <div class="logo-container">
            <a href="home.html">
                <img src="logo.png" alt="Kriskata Logo" class="logo">
            </a>
        </div>

        <nav>
            <ul class="desktop-menu">
                <li><a href="work.html">Категории</a></li>
                <li><a href="contact.html">Контакти</a></li>
            </ul>

            <div class="hamburger" id="hamburger-icon" onclick="toggleMenu()">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
        </nav>
    </header>

    <!-- Мобилно меню -->
    <div class="dropdown-content" id="mobileMenu">
        <ul>
            <li><a href="work.html" onclick="toggleMenu()">Категории</a></li>
            <li><a href="contact.html" onclick="toggleMenu()">Контакти</a></li>
        </ul>
    </div>

    <main>
        <section class="projects-section">
            <h1 class="section-title">Заснети Видеа</h1>
            
            <div class="project-list-videos">
                
                <div class="video-container" onclick="loadVideo(this, 'YrHhMlxn2MY')">
                    <img src="https://img.youtube.com/vi/YrHhMlxn2MY/maxresdefault.jpg" class="video-placeholder" loading="lazy" alt="Заснето видео">
                    <div class="play-button"></div>
                </div>

                <div class="video-container" onclick="loadVideo(this, 'mt-c-ocjG2Y')">
                    <img src="https://img.youtube.com/vi/mt-c-ocjG2Y/maxresdefault.jpg" class="video-placeholder" loading="lazy" alt="Заснето видео">
                    <div class="play-button"></div>
                </div>

                <div class="video-container" onclick="loadVideo(this, 'OrQvmfasd3I')">
                    <img src="https://img.youtube.com/vi/OrQvmfasd3I/maxresdefault.jpg" class="video-placeholder" loading="lazy" alt="Заснето видео">
                    <div class="play-button"></div>
                </div>

                <div class="video-container" onclick="loadVideo(this, 'r7Tq594_7KQ')">
                    <img src="https://img.youtube.com/vi/r7Tq594_7KQ/maxresdefault.jpg" class="video-placeholder" loading="lazy" alt="Заснето видео">
                    <div class="play-button"></div>
                </div>

                <div class="video-container" onclick="loadVideo(this, 'lPugC4tHp1s')">
                    <img src="https://img.youtube.com/vi/lPugC4tHp1s/maxresdefault.jpg" class="video-placeholder" loading="lazy" alt="Заснето видео">
                    <div class="play-button"></div>
                </div>

                <div class="video-container" onclick="loadVideo(this, 'HB_xYZlCucc')">
                    <img src="https://img.youtube.com/vi/HB_xYZlCucc/maxresdefault.jpg" class="video-placeholder" loading="lazy" alt="Заснето видео">
                    <div class="play-button"></div>
                </div>

            </div>
        </section>
    </main>

    <footer>
        © 2026 Kriskata. Всички права запазени.
    </footer>

    <script>
        // Функция за мобилното меню
        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            const hamburger = document.getElementById('hamburger-icon');
            
            menu.classList.toggle('show');
            hamburger.classList.toggle('open');
        }

        // Функция за зареждане на YouTube iframe при клик
        function loadVideo(container, videoId) {
            container.innerHTML = `
                <iframe 
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen 
                    style="position:absolute; top:0; left:0; width:100%; height:100%; border-radius: 12px;">
                </iframe>
            `;
        }
    </script>
</body>
</html>
